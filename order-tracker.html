<div style="max-width:560px;margin:0 auto;text-align:center;">
  <span style="display:block;margin:0 0 8px;font-family:var(--font-accent--family);font-size:0.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent);">Order status</span>

  <h1 style="margin:0 0 10px;">Track your order</h1>

  <p style="margin:0 auto;max-width:44ch;color:var(--color-foreground-soft);">
    Enter your tracking number below to see the latest shipping status.
  </p>

  <form id="orderTrackForm" style="display:flex;gap:10px;margin-top:28px;">
    <label for="orderTrackInput" style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
      Tracking number
    </label>
    <input
      id="orderTrackInput"
      type="text"
      placeholder="Tracking number"
      autocomplete="off"
      required
      style="flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--color-border-strong);border-radius:var(--style-border-radius-inputs);background:var(--color-background);color:var(--color-foreground);font:inherit;font-size:1rem;"
    >
    <button type="submit" class="btn btn--dark">Track</button>
  </form>

  <p id="orderTrackError" hidden style="margin:14px 0 0;padding:10px 14px;border-radius:var(--style-radius-sm);background:var(--color-warning-soft);color:var(--color-warning);font-size:0.86rem;">
    Live tracking isn't connected yet — check your shipping confirmation email for a tracking link.
  </p>

  <p style="margin:18px 0 0;font-size:0.84rem;color:var(--color-foreground-faint);">
    You'll also find your tracking link in your shipping confirmation email.
  </p>
</div>

<script>
  (function () {
    // Set this to your tracking provider's URL, with {number} where the
    // tracking number should go. Leave it blank ("") to always show the
    // fallback message instead of redirecting. Examples:
    //   17TRACK:     https://t.17track.net/en#nums={number}
    //   AfterShip:   https://yourbrand.aftership.com/{number}
    //   ParcelPanel: https://yourbrand.parcelpanel.com/tracking?num={number}
    var TRACKING_URL_TEMPLATE = "https://t.17track.net/en#nums={number}";

    var form = document.getElementById('orderTrackForm');
    var errorEl = document.getElementById('orderTrackError');
    if (!form) return;

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var input = document.getElementById('orderTrackInput');
      var value = input.value.trim();
      if (!value) return;

      if (!TRACKING_URL_TEMPLATE) {
        if (errorEl) errorEl.hidden = false;
        return;
      }
      if (errorEl) errorEl.hidden = true;
      window.location.href = TRACKING_URL_TEMPLATE.replace('{number}', encodeURIComponent(value));
    });
  })();
</script>
